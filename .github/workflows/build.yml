name: Build & deploy

on:
  schedule:
    # Elk halfuur checken of Cardmarket een nieuwe price guide heeft gepubliceerd.
    # De guide verschijnt één keer per dag (~02:48 CET); zonder wijziging wordt niets gedeployd.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Altijd bouwen, ook zonder wijziging in de bronbestanden'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tests
        run: node --test
      - name: Build data
        id: build
        run: node scripts/build.mjs
        env:
          GAME_ID: '6'
          SITE_URL: https://nubeslunae.github.io/cardmarket-dealfinder
          FORCE: ${{ (github.event_name == 'push' || inputs.force) && 'true' || '' }}
      - name: Setnamen aanvullen uit Cardmarket-keuzelijst (via Internet Archive, faalt zacht)
        if: steps.build.outputs.changed == 'true'
        run: node scripts/cardmarket-expansions.mjs
      - name: TCGdex-koppeling (kaartnummers, afbeeldingen; incrementeel, faalt zacht)
        if: steps.build.outputs.changed == 'true'
        run: node scripts/tcgdex-sync.mjs
        env:
          SITE_URL: https://nubeslunae.github.io/cardmarket-dealfinder
      - name: Exacte Cardmarket-productlinks (via pokemontcg.io-doorverwijzing; incrementeel, faalt zacht)
        if: steps.build.outputs.changed == 'true'
        run: node scripts/cmurl-sync.mjs
        env:
          SITE_URL: https://nubeslunae.github.io/cardmarket-dealfinder
          CMURL_MAX: '5000'
      - name: TCGCSV VS-referentie (gratis; ~440 calls) + setcodes
        if: steps.build.outputs.changed == 'true'
        run: node scripts/tcgcsv-sync.mjs
        env:
          SITE_URL: https://nubeslunae.github.io/cardmarket-dealfinder
      - name: Limitless vraagsignaal (niet bij push; ~40 calls met pauzes)
        if: steps.build.outputs.changed == 'true' && github.event_name != 'push'
        run: node scripts/limitless-sync.mjs
        env:
          SITE_URL: https://nubeslunae.github.io/cardmarket-dealfinder
      - name: JustTCG conditie-prijzen (optioneel, alleen met secret; max 25 calls/run; niet bij push, spaart het maandbudget)
        if: steps.build.outputs.changed == 'true' && github.event_name != 'push'
        run: node scripts/justtcg-sync.mjs
        env:
          SITE_URL: https://nubeslunae.github.io/cardmarket-dealfinder
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
      - name: CardTrader-koppeling (optioneel, alleen met secret)
        if: steps.build.outputs.changed == 'true'
        run: node scripts/cardtrader-sync.mjs
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
      - name: Pages op Actions-deploy zetten (neemt tijdelijke gh-pages-branch over)
        if: steps.build.outputs.changed == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        if: steps.build.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
