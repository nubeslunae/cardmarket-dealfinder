name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test
      - name: Syntax check dashboard
        run: node --check site/app.js
      - name: Build against live Cardmarket files
        run: node scripts/build.mjs
        env:
          FORCE: '1'
          OUT_DIR: /tmp/site-data
